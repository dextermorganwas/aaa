services:
  stremio-art-proxy:
    image: ghcr.io/YOUR-GITHUB-USERNAME/stremio-art-proxy:latest
    container_name: stremio-art-proxy
    restart: unless-stopped
    cpus: "${CPU_LIMIT:-1.0}"
    mem_limit: "${MEMORY_LIMIT:-512m}"
    pids_limit: ${PIDS_LIMIT:-128}
    env_file:
      - .env
    network_mode: host
    volumes:
      - ${DOCKER_DATA_DIR:-./data}/art-proxy:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('PORT', '8099'), timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
