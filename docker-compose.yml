services:
  stremio-art-proxy:
    image: ghcr.io/YOUR-GITHUB-USERNAME/stremio-art-proxy:latest
    container_name: stremio-art-proxy
    restart: unless-stopped
    cpus: "${CPU_LIMIT:-1.0}"
    mem_limit: "${MEMORY_LIMIT:-512m}"
    pids_limit: ${PIDS_LIMIT:-128}
    env_file:
      - .env
    ports:
      - "8099:8099"
    volumes:
      - ${DOCKER_DATA_DIR:-./data}/art-proxy:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

