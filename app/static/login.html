<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Stremio Art Proxy</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(420px,calc(100vw - 32px));background:#171a21;border:1px solid #2a2f39;border-radius:16px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
h1{margin:0 0 8px;font-size:24px}.sub{color:#969eab;margin-bottom:24px}label{display:block;margin:0 0 8px;font-size:14px;color:#cbd1da}input{width:100%;background:#0f1115;color:#fff;border:1px solid #39404c;border-radius:10px;padding:12px 13px;font-size:15px}button{width:100%;margin-top:14px;background:#fff;color:#111;border:0;border-radius:10px;padding:11px 14px;font-weight:650;font-size:15px;cursor:pointer}button:hover{opacity:.92}.error{display:none;margin:0 0 14px;padding:10px 12px;border-radius:9px;background:#3a171b;color:#ffb9c0;font-size:14px}
</style></head>
<body><div class="card"><h1>Stremio Art Proxy</h1><div class="sub">Admin sign in</div><div id="error" class="error">Invalid admin token.</div><form id="login"><label for="token">Admin token</label><input id="token" name="token" type="password" autocomplete="current-password" autofocus required><button type="submit">Sign in</button></form></div>
<script>
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const token=document.getElementById('token').value;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({token})});if(r.redirected){location.href=r.url;return}document.getElementById('error').style.display='block';});
</script></body></html>
