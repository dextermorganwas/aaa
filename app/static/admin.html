<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stremio Art Proxy</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee} header{padding:18px 24px;border-bottom:1px solid #333;position:sticky;top:0;background:#111} main{display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 70px)} aside{border-right:1px solid #333;padding:16px;overflow:auto}.item{padding:12px;border:1px solid #333;border-radius:10px;margin:8px 0;cursor:pointer}.item:hover{background:#1a1a1a}.artgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{border:1px solid #333;border-radius:12px;padding:14px}.card img{width:100%;max-height:440px;object-fit:contain;background:#000;border-radius:8px}.cand{display:flex;gap:10px;align-items:center;padding:8px;border-top:1px solid #222}.cand img{width:70px;height:100px;object-fit:cover}.btn{background:#eee;color:#111;border:0;border-radius:8px;padding:7px 10px;cursor:pointer}.muted{color:#999}input{background:#181818;color:#eee;border:1px solid #444;border-radius:8px;padding:9px;width:100%;box-sizing:border-box} @media(max-width:900px){main{grid-template-columns:1fr}.artgrid{grid-template-columns:1fr}.aside{border-right:0;border-bottom:1px solid #333}}
</style></head><body><header><b>Stremio Art Proxy</b> <span class="muted">&nbsp; artwork cache + overrides</span></header><main><aside><input id="q" placeholder="Search requested titles..."><div id="items"></div></aside><section style="padding:20px"><div id="detail" class="muted">Select an item.</div></section></main><script>
const token=prompt('Admin token (stored only in this page session):');
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Authorization':'Bearer '+token}; return fetch(path,opts).then(r=>{if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.json()})}
async function loadItems(){const q=encodeURIComponent(document.getElementById('q').value);const d=await api('/api/admin/items?q='+q);document.getElementById('items').innerHTML=d.items.map(x=>`<div class=item onclick="showItem(${x.id})"><b>${x.title||'Untitled'}</b><div class=muted>${x.media_type} · TMDB ${x.tmdb_id||'-'} · TVDB ${x.tvdb_id||'-'}</div></div>`).join('')}
document.getElementById('q').oninput=loadItems;loadItems();
async function showItem(id){const d=await api('/api/admin/items/'+id);let h=`<h2>${d.item.title||'Untitled'}</h2><div class=muted>${d.item.media_type} · TMDB ${d.item.tmdb_id||'-'} · IMDb ${d.item.imdb_id||'-'} · TVDB ${d.item.tvdb_id||'-'}</div><div class=artgrid>`;for(const [art,x] of Object.entries(d.art)){h+=`<div class=card><h3>${art}</h3>${x.selection?`<img src="/api/admin/items/${d.item.id}/image/${art}?token=${encodeURIComponent(token)}" onerror="this.style.display='none'"><div>Selected: <b>${x.selection.provider}</b></div><div class=muted>${x.selection.source_url||''}</div>`:'<div class=muted>No selection</div>'}<p><button class=btn onclick="refresh(${id},'${art}')">Refresh providers</button></p><div>${x.candidates.map(c=>`<div class=cand><img src="${c.url}" onerror="this.style.display='none'"><div style="flex:1"><b>${c.provider}</b><div class=muted>${c.language||''} ${c.label||''}</div><div class=muted style="word-break:break-all">${c.url}</div><button class=btn onclick="choose(${id},'${art}',${JSON.stringify(c.url)},${JSON.stringify(c.provider)})">Use this</button></div></div>`).join('')}</div></div>`}h+='</div>';document.getElementById('detail').innerHTML=h}
async function refresh(id,art){await api(`/api/admin/items/${id}/refresh/${art}`,{method:'POST'});showItem(id)}
async function choose(id,art,url,provider){await api(`/api/admin/items/${id}/override/${art}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,provider})});showItem(id)}
</script></body></html>
